services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamops
      POSTGRES_USER: teamops
      POSTGRES_PASSWORD: teamops
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamops"]
      interval: 5s
      timeout: 5s
      retries: 5

